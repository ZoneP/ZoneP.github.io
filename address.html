<!DOCTYPE html>
<html lang="zh">
<head>
	<meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>
</head>
<body>
	<button onclick="watchLocation">持续监听位置</button>
	<button onclick="clearWatch">检测权限状态</button>
	<script>
		if (navigator.geolocation){
			navigator.geolocation.getCurrentPosition(function(position) {
				console.log('h5经纬度：', position.coords);
				alert(JSON.stringify(position.coords))
			}, function(err){
				console.log(err);
				alert(err);
			});
		}else {
			console.log("您的设备不支持定位功能");
		}
		
		
		getSmartLocation();
		// 检查地理位置权限状态
		function checkGeolocationPermission() {
			if (!navigator.permissions) {
				return Promise.resolve('unknown');
			}
			return navigator.permissions.query({
				name: 'geolocation'
			}).then(permissionStatus => {
				permissionStatus.onchange = function() {
				  console.log('权限状态变更');
				};
				return permissionStatus.state;
			}).catch(() => 'unknown');
		}
		// 获取用户位置（智能方式）
		function getSmartLocation() {
			checkGeolocationPermission().then(state => {
				console.log('=====', state)
				if (state === 'granted') {
					// 已有权限，直接获取位置 
					navigator.geolocation.getCurrentPosition(position => {
							// 处理位置信息 
							console.log('位置获取成功:', position);
						}, error => {
							// 处理错误 
							console.error('位置获取失败:', error);
						}, {
							timeout: 10000
						}, // 10秒超时 
					);
				} else if (state === 'prompt') {
					// 需要请求权限 
					navigator.geolocation.getCurrentPosition(position => {
						// 处理位置信息 
						console.log('位置获取成功:', position);
					}, error => {
						// 处理错误 
						console.error('位置获取失败:', error);
					});
				} else {
					// 权限被拒绝 
					console.log('地理位置权限已被拒绝');
					navigator.geolocation.getCurrentPosition(position => {
						// 处理位置信息 
						console.log('位置获取成功:', position);
					}, error => {
						// 处理错误 
						console.error('位置获取失败:', error);
					});
				}
			});
		}
		
		let watchId = null;
		// 持续监听
		function watchLocation() {
			if (watchId !== null) {
				alert('已经在监听位置变化');
				return;
			}
			if (!navigator.geolocation) {
				alert('您的浏览器不支持地理位置API');
				return;
			}
			navigator.geolocation.watchPosition(
				position => {
					// 成功获取位置
					const { latitude, longitude, accuracy } = position.coords;
					const timestamp = new Date(position.timestamp).toLocaleString();
					console.log('位置更新:', position, timestamp);
				},
				error => {
					// 处理错误
					let errorMessage = '监听位置失败: ';
					switch(error.code) {
						case error.PERMISSION_DENIED:
							errorMessage += '用户拒绝了地理位置请求';
							break;
						case error.POSITION_UNAVAILABLE:
							errorMessage += '无法获取当前位置信息';
							break;
						case error.TIMEOUT:
							errorMessage += '获取位置信息超时';
							break;
						default:
							errorMessage += '发生未知错误';
					}
					
					alert(errorMessage);
					console.error('位置监听失败:', error);
				},
				{
					enableHighAccuracy: true,
					timeout: 10000,
					maximumAge: 0
				}
			);
		}
		// 停止监听位置
		function clearWatch() {
			if (watchId !== null) {
				navigator.geolocation.clearWatch(watchId);
				watchId = null;
				alert('已停止监听位置变化');
			} else {
				alert('当前没有活跃的位置监听');
			}
		}
	</script>
</body>
</html>
