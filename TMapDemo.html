<!DOCTYPE html>
<html lang="zh">
	<head>
		<meta charset="UTF-8">
		<meta http-equiv="X-UA-Compatible" content="IE=edge">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Document</title>
    <script src="https://mapapi.qq.com/web/lbs/h5-components/geolocation/geolocation.min.js"></script>
		<script src="https://map.qq.com/api/gljs?v=1.exp&key=EIGBZ-VTH3X-3OX4P-TI5TD-VD265-6GBDH"></script>
		<style>
			* {
				padding: 0;
				margin: 0;
			}

			html,
			body {
				width: 100%;
				height: 100%;
				overflow: hidden;
			}

			#map {
				width: 100%;
				height: 100%;
				overflow: hidden;
			}
		</style>
	</head>
	<body>
		<div id="container"></div>
		<script>
			/** LBS申请的key */
			const key = 'EIGBZ-VTH3X-3OX4P-TI5TD-VD265-6GBDH';
			/** 项目标识 */
			const referer = 'mpapp';
			/** 定位组件实例 */
			const geoInstance = new window.LBS.WebComponent.Geolocation({ key, referer });
			/** 精确定位配置项 */
			const options = { timeout: 6000, highAccuracy: true };
			/** 展示定位结果 */
			const onSuccess = (result) => {
				console.log('>>> 定位成功回调数据', result);
				const { lat, lng } = result;
				alert(lat, lng);
			};
			/** 失败回调 */
			const onError = (error) => {
				console.log('>>> 定位失败回调数据', error);
				alert(JSON.stringify(error));
			};
			
			const getLocation = () => geoInstance.getLocation(onSuccess, onError, options);
			getLocation();
		</script>
	</body>
</html>
